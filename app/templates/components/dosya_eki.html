<!-- 
  FDYS — Yeniden Kullanılabilir Dosya Eki Bileşeni
  Kullanım: { % include 'components/dosya_eki.html' with context % }
  Gerekli değişkenler: kaynak_tablo (str), kaynak_id (int)
-->
<div class="card border-0 mb-4" id="dosyaEkiKart">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="card-title mb-0 fw-bold"><i class="bi bi-paperclip me-2"></i>Dosya Ekleri</h5>
        <button class="btn btn-sm btn-primary" onclick="document.getElementById('dosyaYukleAlani').classList.toggle('d-none')">
            <i class="bi bi-plus-lg me-1"></i>Dosya Ekle
        </button>
    </div>
    <div class="card-body">
        <!-- Yükleme Alanı -->
        <div id="dosyaYukleAlani" class="d-none mb-4">
            <div id="dosyaDropZone" class="border border-2 border-dashed rounded-3 p-4 text-center mb-3"
                 style="border-color: var(--border-light) !important; cursor:pointer; transition: all 0.2s;"
                 ondragover="event.preventDefault(); this.style.borderColor='#3b82f6'; this.style.background='rgba(59,130,246,0.05)';"
                 ondragleave="this.style.borderColor=''; this.style.background='';"
                 ondrop="dosyaBirak(event)"
                 onclick="document.getElementById('dosyaInput').click()">
                <i class="bi bi-cloud-arrow-up display-5 text-muted d-block mb-2"></i>
                <p class="text-muted mb-1">Dosyaları sürükle-bırak veya tıkla</p>
                <small class="text-muted">JPG, PNG, PDF, DOC, XLS — Maks. 32 MB</small>
            </div>
            <input type="file" id="dosyaInput" multiple accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.doc,.docx,.xls,.xlsx,.csv" class="d-none" onchange="dosyaYukle()">
            <div id="dosyaYuklemeIlerleme" class="d-none">
                <div class="progress mb-2" style="height:6px;">
                    <div class="progress-bar bg-primary" id="dosyaProgressBar" style="width:0%"></div>
                </div>
                <small class="text-muted" id="dosyaYuklemeMetin">Yükleniyor...</small>
            </div>
        </div>

        <!-- Dosya Galerisi -->
        <div id="dosyaGaleri" class="row g-3"></div>
        <div id="dosyaBos" class="text-center py-4 d-none">
            <i class="bi bi-folder2-open display-4 text-muted opacity-25 d-block mb-2"></i>
            <p class="text-muted small mb-0">Henüz dosya eklenmemiş</p>
        </div>
    </div>
</div>

<!-- Lightbox Modal -->
<div class="modal fade" id="dosyaLightbox" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0" style="background:rgba(0,0,0,0.95);">
            <div class="modal-header border-0 pb-0">
                <h6 class="modal-title text-white" id="lightboxBaslik"></h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center p-4">
                <img id="lightboxResim" src="" class="img-fluid rounded" style="max-height:70vh;">
            </div>
        </div>
    </div>
</div>

<!-- Silme Onay Modal -->
<div class="modal fade" id="dosyaSilModal" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h6 class="modal-title fw-bold"><i class="bi bi-trash3 me-2 text-danger"></i>Dosya Sil</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="mb-0">Bu dosyayı silmek istediğinizden emin misiniz?</p>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">İptal</button>
                <button type="button" class="btn btn-danger btn-sm" id="dosyaSilOnayla" onclick="dosyaSilOnayla()">Sil</button>
            </div>
        </div>
    </div>
</div>

<script>
const DOSYA_KAYNAK_TABLO = '{{ kaynak_tablo }}';
const DOSYA_KAYNAK_ID = {{ kaynak_id }};
const CSRF_TOKEN = document.querySelector('meta[name="csrf-token"]')?.content || '';
let _silinecekDosyaId = null;

document.addEventListener('DOMContentLoaded', dosyaListele);

function dosyaListele() {
    fetch(`/dosya/listele/${DOSYA_KAYNAK_TABLO}/${DOSYA_KAYNAK_ID}`)
        .then(r => r.json())
        .then(data => {
            const galeri = document.getElementById('dosyaGaleri');
            const bos = document.getElementById('dosyaBos');
            galeri.innerHTML = '';
            if (!data.dosyalar || data.dosyalar.length === 0) {
                bos.classList.remove('d-none');
                return;
            }
            bos.classList.add('d-none');
            data.dosyalar.forEach(d => {
                const col = document.createElement('div');
                col.className = 'col-6 col-md-4 col-lg-3';
                if (d.resim_mi) {
                    col.innerHTML = `
                        <div class="card border-0 h-100" style="background:var(--bg-body);">
                            <img src="${d.onizleme_url}" class="card-img-top" style="height:120px;object-fit:cover;cursor:pointer;border-radius:0.75rem 0.75rem 0 0;" onclick="lightboxAc('${d.orijinal_adi}','${d.onizleme_url}')">
                            <div class="card-body p-2">
                                <small class="d-block text-truncate fw-medium" title="${d.orijinal_adi}">${d.orijinal_adi}</small>
                                <small class="text-muted">${d.boyut}</small>
                                <div class="mt-1">
                                    <a href="${d.indirme_url}" class="btn btn-outline-secondary btn-sm py-0 px-1" title="İndir"><i class="bi bi-download"></i></a>
                                    <button class="btn btn-outline-danger btn-sm py-0 px-1" onclick="dosyaSilSor(${d.id})" title="Sil"><i class="bi bi-trash3"></i></button>
                                </div>
                            </div>
                        </div>`;
                } else {
                    col.innerHTML = `
                        <div class="card border-0 h-100" style="background:var(--bg-body);">
                            <div class="card-body p-3 text-center">
                                <i class="bi ${d.ikon} display-5 d-block mb-2 text-muted"></i>
                                <small class="d-block text-truncate fw-medium" title="${d.orijinal_adi}">${d.orijinal_adi}</small>
                                <small class="text-muted">${d.boyut}</small>
                                <div class="mt-2">
                                    <a href="${d.indirme_url}" class="btn btn-outline-secondary btn-sm py-0 px-1"><i class="bi bi-download"></i></a>
                                    <button class="btn btn-outline-danger btn-sm py-0 px-1" onclick="dosyaSilSor(${d.id})"><i class="bi bi-trash3"></i></button>
                                </div>
                            </div>
                        </div>`;
                }
                galeri.appendChild(col);
            });
        });
}

function dosyaYukle() {
    const input = document.getElementById('dosyaInput');
    if (!input.files.length) return;
    const fd = new FormData();
    fd.append('kaynak_tablo', DOSYA_KAYNAK_TABLO);
    fd.append('kaynak_id', DOSYA_KAYNAK_ID);
    for (let f of input.files) fd.append('dosyalar', f);

    const prog = document.getElementById('dosyaYuklemeIlerleme');
    const bar = document.getElementById('dosyaProgressBar');
    prog.classList.remove('d-none');

    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/dosya/yukle');
    xhr.setRequestHeader('X-CSRFToken', CSRF_TOKEN);
    xhr.upload.onprogress = e => { if (e.lengthComputable) bar.style.width = Math.round(e.loaded/e.total*100)+'%'; };
    xhr.onload = () => {
        prog.classList.add('d-none');
        bar.style.width = '0%';
        input.value = '';
        const res = JSON.parse(xhr.responseText);
        if (res.success) {
            if (typeof showToast === 'function') showToast(`${res.yuklenen_sayisi} dosya yüklendi.`, 'success');
            dosyaListele();
            document.getElementById('dosyaYukleAlani').classList.add('d-none');
        } else {
            if (typeof showToast === 'function') showToast(res.error || 'Yükleme hatası.', 'danger');
        }
    };
    xhr.send(fd);
}

function dosyaBirak(e) {
    e.preventDefault();
    e.currentTarget.style.borderColor = '';
    e.currentTarget.style.background = '';
    const input = document.getElementById('dosyaInput');
    input.files = e.dataTransfer.files;
    dosyaYukle();
}

function lightboxAc(ad, url) {
    document.getElementById('lightboxBaslik').textContent = ad;
    document.getElementById('lightboxResim').src = url;
    new bootstrap.Modal(document.getElementById('dosyaLightbox')).show();
}

function dosyaSilSor(id) {
    _silinecekDosyaId = id;
    new bootstrap.Modal(document.getElementById('dosyaSilModal')).show();
}

function dosyaSilOnayla() {
    if (!_silinecekDosyaId) return;
    fetch(`/dosya/sil/${_silinecekDosyaId}`, {
        method: 'POST', headers: {'X-CSRFToken': CSRF_TOKEN}
    }).then(r => r.json()).then(res => {
        bootstrap.Modal.getInstance(document.getElementById('dosyaSilModal'))?.hide();
        if (res.success) {
            if (typeof showToast === 'function') showToast('Dosya silindi.', 'success');
            dosyaListele();
        }
        _silinecekDosyaId = null;
    });
}
</script>
